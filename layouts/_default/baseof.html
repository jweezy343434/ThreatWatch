<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e5e5e5;
            --text-dim: #999;
            --accent: #ff4444;
            --border: #222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            padding: 2rem 1rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 0.5rem;
            color: var(--accent);
        }
        .tagline {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }
        article {
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
        }
        article:last-child { border-bottom: none; }
        article h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        article h2 a {
            color: var(--text);
            text-decoration: none;
        }
        article h2 a:hover { color: var(--accent); }
        .meta {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .source {
            color: var(--accent);
            font-weight: 500;
        }
        .analysis { line-height: 1.7; }
        .analysis p { margin-bottom: 1rem; }
        .analysis strong { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ .Site.Title }}</h1>
        <p class="tagline">{{ .Site.Params.description }}</p>
        {{ block "main" . }}{{ end }}
    </div>
</body>
</html>
